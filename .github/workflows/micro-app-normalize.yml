name: Normalize Micro App Expansion

on:
  push:
    branches: [feature/micro-app-expansion-01]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/micro-app-expansion-01
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize generated commercial state
        run: python scripts/apply_commercial_polish.py --write

      - name: Commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Normalize micro-app commercial state"
          git push origin HEAD:feature/micro-app-expansion-01
