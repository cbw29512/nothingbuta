name: Commercial Quality

on:
  push:
    branches:
      - main
      - audit/commercial-polish-20260904
  workflow_dispatch:

concurrency:
  group: commercial-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate commercial polish on development branch
        if: github.ref == 'refs/heads/audit/commercial-polish-20260904' && github.actor != 'github-actions[bot]'
        run: python scripts/apply_commercial_polish.py --write

      - name: Verify generated commercial state
        run: python scripts/apply_commercial_polish.py --check

      - name: Verify JavaScript syntax
        run: |
          node --check docs/assets/tool-ux.js
          node --check docs/assets/home-ux.js

      - name: Verify calculator privacy boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          blocked = [r'fetch\s*\(', r'XMLHttpRequest', r'sendBeacon\s*\(', r'gtag\s*\(']
          failures = []
          for path in sorted(Path('docs').glob('*/index.html')):
              if path.parent.name in {'privacy', 'terms'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for pattern in blocked:
                  if re.search(pattern, text):
                      failures.append(f'{path}: contains network/analytics pattern {pattern}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Calculator inputs remain client-side: no blocked submission/analytics APIs found in public tool pages.')
          PY

      - name: Verify no obvious committed credentials
        shell: bash
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,255}|github_pat_[A-Za-z0-9_]{50,255}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}'
          found=0
          files="$(git grep -I -l -E -e "$pattern" HEAD -- . || true)"
          names="$(git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json|service-account\.json)$|\.(pem|p12|pfx)$' | grep -v -E '\.env\.example$|\.example\.(pem|key)$' || true)"
          [[ -z "$files" ]] || { echo "Potential credential patterns:"; printf '%s\n' "$files"; found=1; }
          [[ -z "$names" ]] || { echo "Sensitive filenames:"; printf '%s\n' "$names"; found=1; }
          [[ "$found" -eq 0 ]] || exit 1

      - name: Check generated diff
        if: github.ref == 'refs/heads/audit/commercial-polish-20260904' && github.actor != 'github-actions[bot]'
        run: git diff --check

      - name: Commit generated commercial polish
        if: github.ref == 'refs/heads/audit/commercial-polish-20260904' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated commercial state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml docs/*/index.html
          git commit -m "Apply commercial polish across One Clear Tool"
          git push
