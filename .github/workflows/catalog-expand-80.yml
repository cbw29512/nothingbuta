name: Expand 80 Tool Catalog

on:
  push:
    branches: [feature/micro-app-expansion-05]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/micro-app-expansion-05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register and normalize 80 tools
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('scripts/tool_catalog.json')
          items=json.loads(path.read_text())
          additions=[
            {"slug":"character-counter","name":"Character Counter","description":"Count characters, characters without spaces, words, and lines instantly.","category":"Text"},
            {"slug":"meters-to-feet-converter","name":"Meters to Feet Converter","description":"Convert meters to feet instantly.","category":"Conversions"},
            {"slug":"percentage-calculator","name":"Percentage Calculator","description":"Find a percentage of a number and what percent one value is of another.","category":"Everyday"},
            {"slug":"cm-to-inches-converter","name":"Centimeters to Inches Converter","description":"Convert centimeters to inches instantly.","category":"Conversions"},
            {"slug":"liters-to-gallons-converter","name":"Liters to Gallons Converter","description":"Convert liters to US liquid gallons instantly.","category":"Conversions"},
            {"slug":"cups-to-tablespoons-converter","name":"Cups to Tablespoons Converter","description":"Convert US cups to tablespoons instantly.","category":"Conversions"},
            {"slug":"teaspoons-to-tablespoons-converter","name":"Teaspoons to Tablespoons Converter","description":"Convert US teaspoons to tablespoons instantly.","category":"Conversions"},
            {"slug":"add-days-to-date-calculator","name":"Add Days to Date Calculator","description":"Add or subtract calendar days from a selected date.","category":"Everyday"},
            {"slug":"time-duration-calculator","name":"Time Duration Calculator","description":"Calculate elapsed hours and minutes between two clock times.","category":"Everyday"},
            {"slug":"salary-to-hourly-calculator","name":"Salary to Hourly Calculator","description":"Convert annual salary to an estimated hourly rate.","category":"Money & Work"}
          ]
          by_slug={item['slug']:item for item in items}
          for item in additions: by_slug[item['slug']]=item
          path.write_text(json.dumps(list(by_slug.values()),indent=2)+"\n")
          PY
          python scripts/apply_commercial_polish.py --write
          python scripts/sync_tool_catalog.py --write
      - name: Commit normalized 80-tool state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tool_catalog.json docs README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register and normalize 80-tool catalog"
          git push origin HEAD:feature/micro-app-expansion-05
