name: Normalize 60 Tool Catalog

on:
  push:
    branches: [feature/micro-app-expansion-03]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/micro-app-expansion-03
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize commercial and catalog state
        run: |
          python scripts/apply_commercial_polish.py --write
          python scripts/sync_tool_catalog.py --write

      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md
          git commit -m "Normalize 60-tool catalog state"
          git push origin HEAD:feature/micro-app-expansion-03
