<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt-to-Income Calculator | One Clear Tool</title><meta name="description" content="Estimate your debt-to-income ratio from monthly debt payments and gross monthly income."><link rel="canonical" href="https://onecleartool.com/debt-to-income-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Debt-to-Income Calculator</h1><p>Estimate the share of gross monthly income going to debt payments.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><h2>Your numbers</h2><label for="debt">Monthly debt payments</label><input id="debt" type="number" value="1200" min="0" step="0.01"><label for="income">Gross monthly income</label><input id="income" type="number" value="6000" min="0.01" step="0.01"><button type="submit">Calculate DTI</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section><section class="panel"><p class="fine">Planning estimate only. Lenders may define qualifying income and debts differently.</p></section></main><script>function calc(){const d=Number(document.getElementById('debt').value)||0,i=Number(document.getElementById('income').value)||0,o=document.getElementById('out');if(i<=0){o.innerHTML='<div class="warn">Enter gross monthly income above zero.</div>';return;}o.innerHTML=`<div class="metric"><strong>${(d/i*100).toFixed(1)}%</strong><span>Debt-to-income ratio</span></div>`;}calc();</script></body></html>
