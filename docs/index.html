<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NothingButA</title>
  <meta name="description" content="Simple single-purpose web tools that do one job clearly.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a}
    main{width:min(100% - 24px,900px);margin:auto;padding:42px 0}
    .card{background:white;border:1px solid #dbe3ef;border-radius:24px;padding:24px;box-shadow:0 14px 40px rgba(15,23,42,.08)}
    h1{font-size:clamp(36px,8vw,64px);line-height:1;margin:0 0 12px;letter-spacing:-.05em}
    p{color:#475569;line-height:1.5;font-size:18px}
    a{display:inline-block;margin-top:12px;background:#2563eb;color:white;text-decoration:none;font-weight:900;padding:14px 18px;border-radius:16px}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>NothingButA</h1>
      <p>Simple single-purpose web tools that do one job clearly.</p>
      <a href="./nothingbuta/debt-payoff-calculator/">Open the Debt Payoff Calculator</a>
    </section>
  </main>
</body>
</html>
