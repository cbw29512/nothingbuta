<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Days to Date Calculator | One Clear Tool</title><meta name="description" content="Add or subtract calendar days from a date."><link rel="canonical" href="https://onecleartool.com/add-days-to-date-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Add Days to Date Calculator</h1><p>Add or subtract calendar days from a date.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="date">Starting date</label><input id="date" type="date" value="2026-09-04"><label for="days">Days to add or subtract</label><input id="days" type="number" value="30" step="1"><button type="submit">Calculate date</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const d=new Date(document.getElementById('date').value+'T12:00:00'),n=Number(document.getElementById('days').value)||0,o=document.getElementById('out');if(!Number.isFinite(d.getTime())){o.innerHTML='<div class="warn">Choose a valid date.</div>';return;}d.setDate(d.getDate()+n);o.innerHTML=`<div class="metric"><strong>${d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</strong><span>Result date</span></div>`;}calc();</script></body></html>
