<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Days Until Date Calculator | One Clear Tool</title><meta name="description" content="Count the number of days from a start date to a future target date."><link rel="canonical" href="https://onecleartool.com/days-until-date-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Days Until Date Calculator</h1><p>Count calendar days from one date to another.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><h2>Your dates</h2><label for="start">Start date</label><input id="start" type="date" value="2026-09-04"><label for="target">Target date</label><input id="target" type="date" value="2026-12-25"><button type="submit">Count days</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const a=new Date(document.getElementById('start').value+'T00:00:00'),b=new Date(document.getElementById('target').value+'T00:00:00'),o=document.getElementById('out');if(!Number.isFinite(a.getTime())||!Number.isFinite(b.getTime())){o.innerHTML='<div class="warn">Choose two valid dates.</div>';return;}const d=Math.ceil((b-a)/86400000);o.innerHTML=`<div class="metric"><strong>${d}</strong><span>Calendar days</span></div>`;}calc();</script></body></html>
