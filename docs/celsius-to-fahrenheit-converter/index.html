<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celsius to Fahrenheit Converter | One Clear Tool</title><meta name="description" content="Convert Celsius temperatures to Fahrenheit instantly."><link rel="canonical" href="https://onecleartool.com/celsius-to-fahrenheit-converter/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Celsius to Fahrenheit Converter</h1><p>Convert Celsius temperatures to Fahrenheit.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="value">Celsius</label><input id="value" type="number" value="20" step="0.1"><button type="submit">Convert</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const v=Number(document.getElementById('value').value)||0;document.getElementById('out').innerHTML=`<div class="metric"><strong>${(v*9/5+32).toFixed(1)} °F</strong><span>Fahrenheit</span></div>`;}calc();</script></body></html>
