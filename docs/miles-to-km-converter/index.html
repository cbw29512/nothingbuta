<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miles to Kilometers Converter | One Clear Tool</title><meta name="description" content="Convert miles to kilometers instantly."><link rel="canonical" href="https://onecleartool.com/miles-to-km-converter/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Miles to Kilometers Converter</h1><p>Convert miles to kilometers.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="value">Miles</label><input id="value" type="number" value="10" step="0.01"><button type="submit">Convert</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const v=Number(document.getElementById('value').value)||0;document.getElementById('out').innerHTML=`<div class="metric"><strong>${(v*1.609344).toFixed(3)} km</strong><span>Kilometers</span></div>`;}calc();</script></body></html>
