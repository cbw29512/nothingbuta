<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary to Hourly Calculator | One Clear Tool</title><meta name="description" content="Convert annual salary to an estimated hourly rate from weekly hours and working weeks."><link rel="canonical" href="https://onecleartool.com/salary-to-hourly-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Salary to Hourly Calculator</h1><p>Convert annual salary into an estimated hourly rate.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="salary">Annual salary</label><input id="salary" type="number" value="60000" min="0" step="100"><label for="hours">Hours per week</label><input id="hours" type="number" value="40" min="0.1" step="0.1"><label for="weeks">Working weeks per year</label><input id="weeks" type="number" value="52" min="0.1" step="0.1"><button type="submit">Calculate hourly rate</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section><section class="panel"><p class="fine">Gross-pay estimate only; it does not account for taxes, benefits, unpaid time, or overtime rules.</p></section></main><script>const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});function calc(){const s=Number(document.getElementById('salary').value)||0,h=Number(document.getElementById('hours').value)||0,w=Number(document.getElementById('weeks').value)||0,o=document.getElementById('out');if(h<=0||w<=0){o.innerHTML='<div class="warn">Enter hours and weeks above zero.</div>';return;}o.innerHTML=`<div class="metric"><strong>${usd.format(s/(h*w))}</strong><span>Estimated hourly rate</span></div>`;}calc();</script></body></html>
