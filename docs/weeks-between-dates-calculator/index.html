<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weeks Between Dates Calculator | One Clear Tool</title><meta name="description" content="Calculate the number of weeks and days between two dates."><link rel="canonical" href="https://onecleartool.com/weeks-between-dates-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Weeks Between Dates Calculator</h1><p>See the elapsed time between two dates in weeks and days.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><h2>Your dates</h2><label for="start">Start date</label><input id="start" type="date" value="2026-09-04"><label for="end">End date</label><input id="end" type="date" value="2026-10-30"><button type="submit">Calculate weeks</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const a=new Date(document.getElementById('start').value+'T00:00:00'),b=new Date(document.getElementById('end').value+'T00:00:00'),o=document.getElementById('out');const days=Math.abs(Math.round((b-a)/86400000));const w=Math.floor(days/7),r=days%7;o.innerHTML=`<div class="metric"><strong>${w}</strong><span>Whole weeks</span></div><div class="metric"><strong>${r}</strong><span>Extra days</span></div>`;}calc();</script></body></html>
