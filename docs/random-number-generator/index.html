<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number Generator | One Clear Tool</title><meta name="description" content="Generate a random whole number between a minimum and maximum value."><link rel="canonical" href="https://onecleartool.com/random-number-generator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Random Number Generator</h1><p>Generate a random whole number inside a range you choose.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><h2>Your range</h2><label for="min">Minimum</label><input id="min" type="number" value="1" step="1"><label for="max">Maximum</label><input id="max" type="number" value="100" step="1"><button type="submit">Generate number</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section><section class="panel"><h2>Simple random choice</h2><p>This tool generates a whole number from the inclusive range you enter. It is intended for everyday choices and games, not cryptographic or security use.</p></section></main><script>const n=id=>Number(document.getElementById(id).value);function calc(){const a=Math.ceil(n('min')),b=Math.floor(n('max')),o=document.getElementById('out');if(!Number.isFinite(a)||!Number.isFinite(b)||a>b){o.innerHTML='<div class="warn">Enter a valid minimum and maximum.</div>';return;}const r=Math.floor(Math.random()*(b-a+1))+a;o.innerHTML=`<div class="metric"><strong>${r}</strong><span>Random whole number</span></div>`;}calc();</script></body></html>
