<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cups to Tablespoons Converter | One Clear Tool</title><meta name="description" content="Convert US cups to tablespoons instantly."><link rel="canonical" href="https://onecleartool.com/cups-to-tablespoons-converter/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Cups to Tablespoons Converter</h1><p>Convert US cups to tablespoons.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="value">Cups</label><input id="value" type="number" value="1" step="0.01"><button type="submit">Convert</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const v=Number(document.getElementById('value').value)||0;document.getElementById('out').innerHTML=`<div class="metric"><strong>${(v*16).toFixed(2)} tbsp</strong><span>Tablespoons</span></div>`;}calc();</script></body></html>
