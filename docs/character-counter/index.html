<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Counter | One Clear Tool</title><meta name="description" content="Count characters, characters without spaces, words, and lines instantly."><link rel="canonical" href="https://onecleartool.com/character-counter/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Character Counter</h1><p>Count characters, words, and lines as you type.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="text">Text</label><textarea id="text" rows="10">Count this text.</textarea><button type="submit">Count</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const t=document.getElementById('text').value,w=t.trim()?t.trim().split(/\s+/).length:0,l=t? t.split(/\r?\n/).length:0;document.getElementById('out').innerHTML=`<div class="metric"><strong>${t.length}</strong><span>Characters</span></div><div class="metric"><strong>${t.replace(/\s/g,'').length}</strong><span>Without spaces</span></div><div class="metric"><strong>${w}</strong><span>Words</span></div><div class="metric"><strong>${l}</strong><span>Lines</span></div>`;}calc();</script></body></html>
