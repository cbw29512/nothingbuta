<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Duration Calculator | One Clear Tool</title><meta name="description" content="Calculate elapsed hours and minutes between two times."><link rel="canonical" href="https://onecleartool.com/time-duration-calculator/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Time Duration Calculator</h1><p>Calculate elapsed time between two clock times.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="start">Start time</label><input id="start" type="time" value="09:00"><label for="end">End time</label><input id="end" type="time" value="17:30"><button type="submit">Calculate duration</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function mins(v){const [h,m]=v.split(':').map(Number);return h*60+m;}function calc(){const s=mins(document.getElementById('start').value),e=mins(document.getElementById('end').value),o=document.getElementById('out');let d=e-s;if(d<0)d+=1440;const h=Math.floor(d/60),m=d%60;o.innerHTML=`<div class="metric"><strong>${h} hr ${m} min</strong><span>Elapsed time</span></div><div class="metric"><strong>${(d/60).toFixed(2)}</strong><span>Decimal hours</span></div>`;}calc();</script></body></html>
