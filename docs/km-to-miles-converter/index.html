<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kilometers to Miles Converter | One Clear Tool</title><meta name="description" content="Convert kilometers to miles instantly."><link rel="canonical" href="https://onecleartool.com/km-to-miles-converter/"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="wrap"><section class="hero"><span class="eyebrow">One Clear Tool</span><h1>Kilometers to Miles Converter</h1><p>Convert kilometers to miles.</p></section><section class="grid"><form class="card" onsubmit="event.preventDefault();calc();"><label for="value">Kilometers</label><input id="value" type="number" value="10" step="0.01"><button type="submit">Convert</button></form><section class="result" aria-live="polite"><h2>Result</h2><div id="out"></div></section></section></main><script>function calc(){const v=Number(document.getElementById('value').value)||0;document.getElementById('out').innerHTML=`<div class="metric"><strong>${(v/1.609344).toFixed(3)} mi</strong><span>Miles</span></div>`;}calc();</script></body></html>
